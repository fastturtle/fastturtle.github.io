        - "<strong><a href=\"https://deepmind.google/models/gemini/\">Gemini</a> · Core contributor (2022–2024).</strong> Helped establish multimodal image and video generation capabilities, vision infrastructure, and scaling analyses."
        - "<strong><a href=\"https://deepmind.google/blog/a-generalist-agent/\">Gato</a> · Tech lead and core contributor (2021–2022).</strong> Led technical development and built foundational data infrastructure for the multi-modal, multi-embodiment generalist agent."
        - "<strong><a href=\"https://arxiv.org/abs/1804.08617\">Distributed reinforcement learning</a> · Lead and core contributor (2017–2021).</strong> Pioneered actor–learner systems at scale and helped create <a href=\"https://github.com/google-deepmind/acme\">Acme</a>, <a href=\"https://github.com/google-deepmind/reverb\">Reverb</a>, and <a href=\"https://github.com/google-deepmind/launchpad\">Launchpad</a>."

