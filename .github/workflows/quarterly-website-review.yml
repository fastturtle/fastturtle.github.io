name: Quarterly website review

on:
  schedule:
    - cron: "17 9 1 1,4,7,10 *"
      timezone: "Europe/London"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  create-review-reminder:
    name: Create review reminder
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TZ: Europe/London

    steps:
      - name: Ensure the reminder label exists
        run: >-
          gh label create website-review
          --repo "$GITHUB_REPOSITORY"
          --color "8250DF"
          --description "Quarterly reminder to review the personal website"
          --force

      - name: Create this quarter's reminder
        shell: bash
        run: |
          set -euo pipefail

          month=$(date +%-m)
          quarter=$(( (month - 1) / 3 + 1 ))
          year=$(date +%Y)
          title="Quarterly website review — ${year} Q${quarter}"

          if gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state all \
            --search "\"${title}\" in:title" \
            --json title \
            --jq '.[].title' | grep -Fxq "$title"; then
            echo "A reminder for ${year} Q${quarter} already exists."
            exit 0
          fi

          body=$(printf '%s\n' \
            "Time for the quarterly review of [gabrielbm.com](https://gabrielbm.com)." \
            "" \
            "- [ ] Review \`_news/\` for launches, talks, awards, and other milestones" \
            "- [ ] Update roles, projects, education, or talks in \`_data/cv.yml\`" \
            "- [ ] Check selected publications in \`_bibliography/papers.bib\`" \
            "- [ ] Refresh the homepage biography and current-work summary if needed" \
            "- [ ] Review open \`external-mention\` issues from Google Alerts" \
            "- [ ] Build the site and spot-check external links" \
            "" \
            "_Created automatically by the quarterly website review workflow._")

          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "$title" \
            --body "$body" \
            --assignee "$GITHUB_REPOSITORY_OWNER" \
            --label website-review
