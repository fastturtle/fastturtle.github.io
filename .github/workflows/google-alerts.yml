name: Google Alerts monitor

on:
  schedule:
    - cron: "23 8 * * *"
      timezone: "Europe/London"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-alerts:
    name: Check for new mentions
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check configuration
        id: configuration
        env:
          GOOGLE_ALERTS_RSS_URL: ${{ secrets.GOOGLE_ALERTS_RSS_URL }}
        shell: bash
        run: |
          if [[ -z "$GOOGLE_ALERTS_RSS_URL" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Google Alerts not configured::Add the GOOGLE_ALERTS_RSS_URL repository secret to enable mention monitoring."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the repository
        if: steps.configuration.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Ensure the mention label exists
        if: steps.configuration.outputs.configured == 'true'
        run: >-
          gh label create external-mention
          --repo "$GITHUB_REPOSITORY"
          --color "1D76DB"
          --description "Possible public mention to review for the website"
          --force

      - name: Read Google Alerts feed
        if: steps.configuration.outputs.configured == 'true'
        env:
          GOOGLE_ALERTS_RSS_URL: ${{ secrets.GOOGLE_ALERTS_RSS_URL }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/read_google_alerts.py \
            "$GOOGLE_ALERTS_RSS_URL" \
            > "$RUNNER_TEMP/google-alerts.json"

      - name: Create issues for unseen results
        if: steps.configuration.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail

          alerts_file="$RUNNER_TEMP/google-alerts.json"
          seen_file="$RUNNER_TEMP/google-alerts-seen.txt"
          max_issues=10
          created=0
          skipped=0

          gh api \
            --paginate \
            "repos/${GITHUB_REPOSITORY}/issues?state=all&labels=external-mention&per_page=100" \
            --jq '.[].body // ""' \
            | grep -oE 'google-alert-id:[a-f0-9]+' \
            | cut -d: -f2- \
            | sort -u > "$seen_file" || true

          while IFS= read -r alert; do
            alert_id=$(jq -r '.id' <<< "$alert")

            if grep -Fxq "$alert_id" "$seen_file"; then
              skipped=$((skipped + 1))
              continue
            fi

            if (( created >= max_issues )); then
              echo "Reached the safety limit of ${max_issues} new issues in one run."
              break
            fi

            headline=$(jq -r '.title' <<< "$alert")
            issue_title=$(jq -r '.issue_title' <<< "$alert")
            link=$(jq -r '.link' <<< "$alert")
            published=$(jq -r 'if .published == "" then "Unknown" else .published end' <<< "$alert")
            source=$(jq -r 'if .source == "" then "Unknown" else .source end' <<< "$alert")

            body=$(printf '%s\n' \
              "Google Alerts found a possible new public mention." \
              "" \
              "**Headline:** ${headline}" \
              "**Source:** ${source}" \
              "**Published:** ${published}" \
              "**Link:** ${link}" \
              "" \
              "- [ ] Confirm that this result is about Gabriel Barth-Maron" \
              "- [ ] Add or update a website News item if appropriate" \
              "- [ ] Close this issue if no website change is needed" \
              "" \
              "<!-- google-alert-id:${alert_id} -->")

            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$issue_title" \
              --body "$body" \
              --assignee "$GITHUB_REPOSITORY_OWNER" \
              --label external-mention

            printf '%s\n' "$alert_id" >> "$seen_file"
            created=$((created + 1))
          done < <(jq -c '.[]' "$alerts_file")

          {
            echo "### Google Alerts monitor"
            echo
            echo "- Feed results: $(jq length "$alerts_file")"
            echo "- New issues: ${created}"
            echo "- Previously seen: ${skipped}"
          } >> "$GITHUB_STEP_SUMMARY"
